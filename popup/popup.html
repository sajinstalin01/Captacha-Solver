<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rolex CAPTCHA Lab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><div class="logo">R</div><div><h1>CAPTCHA Lab</h1><p>Detection dashboard</p></div></header>
  <main>
    <section class="hero"><span class="eyebrow">CURRENT TAB</span><div id="status">Ready to scan</div><p id="host">Scan a page to identify CAPTCHA-like widgets.</p></section>
    <button id="scan">Scan current page</button>
    <section class="stats"><div><strong id="count">—</strong><span>Detected now</span></div><div><strong id="total">—</strong><span>Recent findings</span></div></section>
    <h2>Detection results</h2><ul id="results"><li class="empty">No scan run yet.</li></ul>
    <p class="notice">Privacy-first: local detection only. No verification bypass or page uploads.</p>
    <footer>Rolex_key · v0.1.0</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
